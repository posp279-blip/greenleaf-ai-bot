name: Finalize v2 safety

on:
  push:
    branches:
      - feature/friendly-scenario-v2
    paths:
      - scripts/finalize_v2_safety.py
      - .github/workflows/finalize-v2-safety.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/friendly-scenario-v2

      - name: Apply verified safety replacements
        run: python scripts/finalize_v2_safety.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit safety fixes
        run: |
          if git diff --quiet; then
            echo "No safety changes were produced"
            exit 1
          fi
          git config user.name "greenleaf-bot-ci"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/api-server/src/bot/engine-v2.ts artifacts/api-server/src/bot/engine.ts
          git commit -m "Finalize v2 referral and admin safety"
          git push origin HEAD:feature/friendly-scenario-v2
