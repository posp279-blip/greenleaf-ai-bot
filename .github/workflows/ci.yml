name: Greenleaf AI Bot CI

on:
  push:
    branches:
      - main
      - feature/friendly-scenario-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --dir scripts exec tsx --test "$GITHUB_WORKSPACE/artifacts/api-server/src/bot/flow-v2.test.ts"

      - name: Typecheck
        if: always()
        run: pnpm run typecheck

      - name: Build
        if: always()
        run: pnpm run build
