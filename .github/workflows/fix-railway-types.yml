name: Fix Railway TypeScript

on:
  push:
    branches:
      - feature/friendly-scenario-v2
    paths:
      - scripts/fix_railway_types.py
      - .github/workflows/fix-railway-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/friendly-scenario-v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact TypeScript fixes
        run: python scripts/fix_railway_types.py

      - name: Validate API typecheck
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Validate API build
        run: pnpm --filter @workspace/api-server run build

      - name: Commit verified fix
        run: |
          git config user.name "greenleaf-bot-ci"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/api-server/src/bot/engine-v2.ts scripts/fix_railway_types.py .github/workflows/fix-railway-types.yml
          git commit -m "Fix Railway TypeScript compatibility"
          git push origin HEAD:feature/friendly-scenario-v2
