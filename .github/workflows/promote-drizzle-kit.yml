name: Promote Drizzle Kit Runtime Dependency

on:
  push:
    branches:
      - feature/friendly-scenario-v2
    paths:
      - lib/db/package.json

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/friendly-scenario-v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Sync lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name "greenleaf-bot-ci"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/promote-drizzle-kit.yml
          git commit -m "Make drizzle-kit available during Railway pre-deploy"
          git push origin HEAD:feature/friendly-scenario-v2
